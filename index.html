<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMEDI - Inicio de Sesión</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="avatar-circle">
            <svg class="avatar-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <span class="icon">&#128100;</span> <input type="text" id="curp" placeholder="CURP">
            </div>
            <div class="input-wrapper">
                <span class="icon">&#128274;</span> <input type="password" id="password" placeholder="Contraseña">
            </div>
        </div>

        <button class="login-button">Iniciar Sesión</button>

        <div class="emedi-logo">
            <img src="emedi_logo.png" alt="EMEDI Logo">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
